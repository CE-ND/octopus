name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  desktop-macos:
    name: desktop-macos-${{ matrix.electron_arch }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - electron_arch: arm64
            goarch: arm64
          - electron_arch: x64
            goarch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '12.14.0'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install desktop dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync version from tag
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: node scripts/sync-release-version.js

      - name: Prepare desktop assets
        env:
          OCTOPUS_DESKTOP_GOOS: darwin
          OCTOPUS_DESKTOP_GOARCH: ${{ matrix.goarch }}
        run: pnpm desktop:prepare

      - name: Build ad-hoc signed DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm exec electron-builder --mac dmg --${{ matrix.electron_arch }} --publish never

      - name: Verify app signature
        run: |
          app_path=$(find dist/desktop -maxdepth 2 -name 'Octopus.app' -type d -print -quit)
          test -n "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign --display --verbose=2 "$app_path"

      - name: Upload macOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-${{ matrix.electron_arch }}
          path: dist/desktop/*.dmg
          if-no-files-found: error
          retention-days: 7

  desktop-windows:
    name: desktop-windows-x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '12.14.0'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install desktop dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify desktop update logic
        run: |
          pnpm desktop:test
          pnpm desktop:test:bridge

      - name: Sync version from tag
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: node scripts/sync-release-version.js

      - name: Build Windows installers
        env:
          OCTOPUS_DESKTOP_GOOS: windows
          OCTOPUS_DESKTOP_GOARCH: amd64
        run: pnpm desktop:dist:custom

      - name: Verify native installer and isolated installation
        run: |
          pnpm installer:test
          node scripts/verify-native-installer.cjs

      - name: Validate and collect Windows update assets
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: node scripts/collect-release-assets.cjs windows

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x64
          path: dist/release-windows/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: [desktop-macos, desktop-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout released source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '12.14.0'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install release validation dependencies
        run: pnpm install --prod --frozen-lockfile --ignore-scripts

      - name: Collect desktop installers
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist/release
          merge-multiple: true

      - name: Verify installers and update manifest checksums
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: node scripts/collect-release-assets.cjs all

      - name: Select release notes
        id: notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          notes="release-notes/${RELEASE_TAG}.md"
          if [ -f "$notes" ]; then
            echo "path=$notes" >> "$GITHUB_OUTPUT"
            echo "generate=false" >> "$GITHUB_OUTPUT"
          else
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fast-forward master to the tested stable release
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          git fetch origin master
          if git merge-base --is-ancestor origin/master "$GITHUB_SHA"; then
            git push origin "$GITHUB_SHA:refs/heads/master"
          else
            echo "::warning::master has independent changes; synchronize it manually after publishing."
          fi

      - name: Publish complete desktop release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/publish/*.exe
            dist/publish/*.dmg
            dist/publish/*.yml
            dist/publish/*.blockmap
          fail_on_unmatched_files: true
          tag_name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.generate }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') && 'true' || 'false' }}
