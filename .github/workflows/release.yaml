name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  desktop-macos:
    name: desktop-macos-${{ matrix.electron_arch }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - electron_arch: arm64
            goarch: arm64
          - electron_arch: x64
            goarch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 'latest'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install desktop dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync version from tag
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: node scripts/sync-release-version.js

      - name: Prepare desktop assets
        env:
          OCTOPUS_DESKTOP_GOOS: darwin
          OCTOPUS_DESKTOP_GOARCH: ${{ matrix.goarch }}
        run: pnpm desktop:prepare

      - name: Build ad-hoc signed DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm exec electron-builder --mac dmg --${{ matrix.electron_arch }} --publish never

      - name: Verify app signature
        run: |
          app_path=$(find dist/desktop -maxdepth 2 -name 'Octopus.app' -type d -print -quit)
          test -n "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign --display --verbose=2 "$app_path"

      - name: Upload macOS desktop release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/desktop/*.dmg
          prerelease: false
          generate_release_notes: false
          tag_name: ${{ github.ref_name }}
          body: |
            ## ✨ 新功能

            ### 分组级 Responses 历史清洗
            应对聚合站后端资源池轮换导致的 400 错误（"The requested item was created under a different Azure OpenAI resource"）：

            - 分组卡片新增**历史清洗开关**（默认关闭），悬停可查看完整说明；仅对 **GPT 系模型（`gpt-*` / `codex-*`）** 的 OpenAI Responses 请求生效
            - 开启后请求发出前自动清除历史中的服务端状态引用（`previous_response_id`、`conversation`、裸 `reasoning`、`item_reference`、`web_search_call`），对话正文与 function_call / function_call_output 配对完整保留，带密文的 reasoning 全保留
            - 命中特征 400（item 引用失效类）时自动清洗并在本渠道重试一次，会话跨上游资源轮换恢复可用

            ### 分组工具栏强制刷新
            - 分组页工具栏新增**刷新按钮**，一键强制刷新分组列表、预设、模型归属与投影渠道数据
            - 点击播放匀速旋转一圈动画，刷新期间按钮禁用防止重复点击
            - 工具栏图标按钮悬停提示统一升级为动画气泡

            ### 设置页展示服务请求地址
            - 版本信息卡片新增**请求地址**一行，展示完整 OpenAI 兼容端点前缀（`http://<host>:<port>/v1`），支持一键复制

            ## 🐛 修复

            - 修复渠道页更改模型端点格式（移动/启用/停用/重置/快捷建 Key）后，分组页需等待约 30 秒轮询才更新的问题：变更后即时联动刷新分组与模型缓存

  desktop-windows:
    name: desktop-windows-x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 'latest'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install desktop dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync version from tag
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: node scripts/sync-release-version.js

      - name: Build Windows installers
        env:
          OCTOPUS_DESKTOP_GOOS: windows
          OCTOPUS_DESKTOP_GOARCH: amd64
        run: pnpm desktop:dist:custom

      - name: Upload Windows desktop release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/installer-ui/*.exe
          prerelease: false
          tag_name: ${{ github.ref_name }}
