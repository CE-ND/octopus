<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fake plugin page</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 24px; color: #222; }
      code { background: #eee; padding: 2px 5px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <h1>Fake plugin page</h1>
    <p>This page runs inside a sandboxed iframe; it does not receive Octopus admin credentials.</p>
    <p>Plugin: <code id="plugin">unknown</code></p>
    <script>
      window.addEventListener('message', (event) => {
        if (event.data && event.data.type === 'octopus:init') {
          document.getElementById('plugin').textContent = event.data.pluginId || '';
        }
      });
    </script>
  </body>
</html>
